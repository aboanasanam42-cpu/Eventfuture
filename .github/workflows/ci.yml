name: Eventfuture CI

on:
  push:
    branches: [main, fix/secure-real-deployment]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: TypeScript, frontend build, and Python validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install JavaScript dependencies
        run: npm install

      - name: Type-check TypeScript
        run: npm run lint

      - name: Build dashboard
        run: npm run build

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate Python syntax
        run: python -m compileall -q bot.py main.py
